services:
  ascii-backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    networks:
      - ascii-net
      - ascii-db
    depends_on:
      ascii-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  ascii-frontend:
    build:
      context: ./frontend
    networks:
      - ascii-net
  ascii-db:
    image: postgres:18.6-alpine
    networks:
      - ascii-db
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ascii-net:
    driver: bridge
  ascii-db:
    driver: bridge
