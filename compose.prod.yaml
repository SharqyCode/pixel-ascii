services:
  ascii-backend:
    image: sharqycode/ascii-backend:prod
    build:
      target: production
    env_file:
      - ./backend/.env.prod
  ascii-frontend:
    image: sharqycode/ascii-frontend:prod
    build:
      target: production
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  ascii-db:
    env_file:
      - ./db/.env.prod
    volumes:
      - "ascii-db-prod:/var/lib/postgresql"
  ascii-migrate:
    environment:
      - DATABASE_URL=postgresql://admin:C3Tc5%23kgp%23%3DK%23-YL7QEx@ascii-db:5432/ascii_db?sslmode=disable

volumes:
  ascii-db-prod:
